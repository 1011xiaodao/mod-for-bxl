plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.146'
}

version = '0.6.1'
group = 'pioneer'

base {
    archivesName = 'pioneer_colony'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

neoForge {
    version = project.neo_version

    neoFormRuntime {
        // 默认指向 maven.neoforged.net/mojang-meta（本网络 Java 直连被重置），改回 Mojang 官方
        launcherManifestUrl = 'https://piston-meta.mojang.com/mc/game/version_manifest_v2.json'
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        pioneer_colony {
            sourceSet sourceSets.main
        }
    }
}

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
# 本机 JDK 25（纯 ASCII 路径，规范要求；原开发机 F:/mctools/jdk25 不适用）
org.gradle.java.home=/usr/lib/jvm/java-25-openjdk
# 网络不稳时重试
systemProp.org.gradle.internal.repository.max.retries=5
systemProp.org.gradle.internal.repository.initial.backoff=500
systemProp.org.gradle.internal.http.socketTimeout=180000
systemProp.org.gradle.internal.http.connectionTimeout=60000
# 本机 IPv6 不通而 Java 默认优先 IPv6，直连 maven.neoforged.net 会连接重置（curl 正常是因其自动回退 IPv4）
systemProp.java.net.preferIPv4Stack=true

neo_version=21.1.249
